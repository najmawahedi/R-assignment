<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Студенчество: СССР и Россия{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('home') }}">🎓 Студенчество: СССР и Россия</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('study_tips') }}">Учёба</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('campus_life') }}">Студенческая жизнь</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('comparison') }}">Сравнение</a></li>
                <!-- NEW LINKS ADDED HERE -->
                <li class="nav-item"><a class="nav-link" href="{{ url_for('timeline') }}">Хронология</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('gallery') }}">Галерея</a></li>
                <!-- ------------------- -->
                <li class="nav-item"><a class="nav-link" href="{{ url_for('resources') }}">Ресурсы</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-5">
    {% block content %}{% endblock %}
</main>

<footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">Проект: Студенчество в СССР и современной России — Flask &amp; Bootstrap</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
